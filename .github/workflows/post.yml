name: post
on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub пропускає частину запусків, тож часто; публікує не більше одного допису на київську добу
  workflow_dispatch:
    inputs:
      args:
        description: 'аргументи post_ig.py (напр. --status, --whoami, --check <id>, --publish <id>)'
        default: '--status'
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ENABLED: ${{ vars.ENABLED }}
          CHECKED_DATE: ${{ vars.CHECKED_DATE }}
        run: python3 bot/post_ig.py ${{ github.event_name == 'schedule' && '--run' || inputs.args }}
      - name: save state
        if: always()
        run: |
          git config user.name ktstal-bot; git config user.email ktstal-bot@users.noreply.github.com
          git add queue.json
          git diff --cached --quiet || (git commit -m "стан черги" && git push)
